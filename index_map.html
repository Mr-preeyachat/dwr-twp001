<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>แผนที่ค้นหาข้อมูลพื้นที่ (by-ปรียฉัตร ร่องแก้ว)</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <style>
        * { box-sizing: border-box; }
        html, body { margin: 0; height: 100%; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #f5f7fa; }
        .container { display: flex; height: 100vh; position: relative; }
        .panel {
            width: 380px; padding: 18px; background: #fff;
            box-shadow: 2px 0 12px rgba(0,0,0,.15); z-index: 1000;
            overflow-y: auto;
        }
        h2 { margin: 0 0 16px; color: #1769aa; }
        label { display:block; margin: 9px 0 4px; font-weight: 700; }
        input {
            width: 100%; padding: 9px 10px; border: 1px solid #cfd6dd;
            border-radius: 6px; font-size: 14px;
        }
        button {
            width: 100%; padding: 10px; margin-top: 14px; border: 0;
            border-radius: 6px; background: #1976d2; color: #fff;
            font-weight: 700; cursor: pointer;
        }
        button:hover { background: #125ca1; }
        .status { margin-top: 12px; font-weight: 700; font-size: 14px; }
        .result {
            margin-top: 12px; padding: 12px; background: #f7fbff;
            border: 1px solid #d4e7f7; border-radius: 8px; font-size: 14px;
        }
        .row {
            display: flex; justify-content: space-between; gap: 12px;
            padding: 7px 0; border-bottom: 1px solid #e7edf3;
        }
        .row:last-child { border-bottom: 0; }
        .label { color: #5c6773; }
        .value { font-weight: 700; text-align: right; word-break: break-word; }
        .coord {
            margin-bottom: 10px; padding: 10px; border-radius: 7px;
            background: #eef6ff; border: 1px solid #cfe5ff;
        }
        .found { color: #14833b; }
        .notfound { color: #a25a00; }
        
        /* สไตล์สำหรับกล่องข้อมูลสำรอง */
        .osm-box {
            margin-top: 15px; padding: 10px; background: #fff9e6;
            border: 1px solid #ffe58f; border-radius: 6px; font-size: 13px;
        }
        .osm-title { font-weight: bold; color: #b7791f; margin-bottom: 6px; }
        .osm-address { white-space: pre-wrap; word-break: break-word; color: #4a5568; }

        #map { flex: 1; min-width: 0; position: relative; z-index: 1; }
        .leaflet-popup-content { line-height: 1.6; }

        /* Custom Dropdown สำหรับเปลี่ยนสไตล์แผนที่ (ลอยมุมขวาบน) */
        .style-selector-container {
            position: absolute;
            top: 16px;
            right: 16px;
            z-index: 1000;
        }

        .custom-select-wrapper {
            position: relative;
            user-select: none;
            min-width: 200px;
        }

        .custom-select-trigger {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 16px;
            font-size: 14px;
            font-weight: 600;
            color: #2c3e50;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(8px);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .custom-select-trigger:hover {
            background: #ffffff;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.2);
            transform: translateY(-1px);
        }

        .custom-select-trigger .arrow {
            width: 8px;
            height: 8px;
            border-right: 2px solid #555;
            border-bottom: 2px solid #555;
            transform: rotate(45deg);
            transition: transform 0.25s ease;
            margin-left: 12px;
        }

        .custom-select-wrapper.open .custom-select-trigger .arrow {
            transform: rotate(-135deg);
        }

        .custom-options {
            position: absolute;
            display: block;
            top: calc(100% + 8px);
            left: 0;
            right: 0;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(12px);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transform: translateY(-10px);
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            overflow: hidden;
        }

        .custom-select-wrapper.open .custom-options {
            opacity: 1;
            visibility: visible;
            pointer-events: all;
            transform: translateY(0);
        }

        .custom-option {
            position: relative;
            display: flex;
            align-items: center;
            padding: 10px 16px;
            font-size: 13.5px;
            color: #333;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        .custom-option:hover {
            background: #f0f4f9;
            color: #1976d2;
        }

        .custom-option.selected {
            background: #e3f2fd;
            color: #1976d2;
            font-weight: 600;
        }

        .option-icon {
            margin-right: 8px;
            font-size: 15px;
        }

        @media (max-width: 800px) {
            .container { flex-direction: column; }
            .panel { width: 100%; height: 45vh; }
            #map { height: 55vh; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="panel">
        <h2>📍 ค้นหาข้อมูลพื้นที่</h2>

        <label for="lat">Latitude</label>
        <input type="number" id="lat" step="any" placeholder="13.756300">

        <label for="lon">Longitude</label>
        <input type="number" id="lon" step="any" placeholder="100.501800">

        <button type="button" onclick="searchCoordinate()">🔍 ค้นหาพื้นที่</button>

        <div class="status" id="status"></div>
        <div class="result" id="result">
            คลิกบนแผนที่ หรือกรอก Lat/Long แล้วกดค้นหา
        </div>
        
        <!-- กล่องแสดงข้อมูลสำรอง OpenStreetMap -->
        <div class="osm-box" id="osm-box" style="display: none;">
            <div class="osm-title">ℹ️ ข้อมูลที่อยู่สำรอง (OpenStreetMap):</div>
            <div class="osm-address" id="osm-address">กำลังโหลด...</div>
        </div>
    </div>

    <div id="map">
        <!-- Custom Dropdown เมนูเลือกประเภทแผนที่ -->
        <div class="style-selector-container">
            <div class="custom-select-wrapper" id="styleDropdown">
                <div class="custom-select-trigger">
                    <span id="selectedOptionText"><span class="option-icon">🗺️</span> OpenStreetMap</span>
                    <div class="arrow"></div>
                </div>
                <div class="custom-options">
                    <div class="custom-option selected" data-value="osm">
                        <span class="option-icon">🗺️</span> OpenStreetMap
                    </div>
                    <div class="custom-option" data-value="satellite">
                        <span class="option-icon">🛰️</span> ดาวเทียม (Esri)
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    const API_URL = "/api/check_coords";
    const NOMINATIM_URL = "https://nominatim.openstreetmap.org/reverse";

    const map = L.map("map").setView([13.7563, 100.5018], 10);
    let marker = null;

    // นิยาม Tile Layers สำหรับประเภทแผนที่
// นิยาม Tile Layers สำหรับประเภทแผนที่
    const baseLayers = {
        'osm': L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
            maxZoom: 19,
            attribution: "&copy; OpenStreetMap contributors"
        }),
        'satellite': L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}", {
            maxZoom: 19,
            attribution: "Tiles &copy; Esri"
        })
    };

    // แสดงผล Layer เริ่มต้น (OSM)
    let currentLayer = baseLayers['osm'].addTo(map);

    // ✅ ฟังก์ชันสลับสไตล์แผนที่ แบบล็อกพิกัดเดิมไว้ไม่ให้เลื่อน
    function switchLayer(styleKey) {
        // 1. เก็บพิกัดและระดับซูมปัจจุบันไว้ก่อนสลับ
        const currentCenter = map.getCenter();
        const currentZoom = map.getZoom();

        // 2. ลบ Layer เก่า แล้วใส่ Layer ใหม่
        if (currentLayer) {
            map.removeLayer(currentLayer);
        }
        currentLayer = baseLayers[styleKey].addTo(map);

        // 3. คืนค่าพิกัดเดิม + สั่งให้ Leaflet คำนวณขนาดกรอบใหม่ทันที
        map.setView(currentCenter, currentZoom, { animate: false });
        map.invalidateSize();
    }

    // Logic ควบคุม Custom Dropdown
    const dropdown = document.getElementById('styleDropdown');
    const trigger = dropdown.querySelector('.custom-select-trigger');
    const options = dropdown.querySelectorAll('.custom-option');
    const selectedText = document.getElementById('selectedOptionText');

    trigger.addEventListener('click', (e) => {
        e.stopPropagation();
        dropdown.classList.toggle('open');
    });

    options.forEach(option => {
        option.addEventListener('click', function(e) {
            e.stopPropagation(); // ✅ ป้องกัน Event เล็ดลอดไปถึงแผนที่
            
            options.forEach(opt => opt.classList.remove('selected'));
            this.classList.add('selected');
            selectedText.innerHTML = this.innerHTML;
            dropdown.classList.remove('open');
            
            const styleKey = this.getAttribute('data-value');
            switchLayer(styleKey);
        });
    });

    document.addEventListener('click', () => {
        dropdown.classList.remove('open');
    });

    // Event คลิกบนแผนที่
    map.on("click", (e) => {
        updateInputs(e.latlng.lat, e.latlng.lng);
        searchCoordinate();
    });

    function updateInputs(lat, lon) {
        document.getElementById("lat").value = Number(lat).toFixed(6);
        document.getElementById("lon").value = Number(lon).toFixed(6);
    }

    function escapeHtml(value) {
        return String(value ?? "")
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }

    function setMarker(lat, lon, popupHtml = "ตำแหน่งที่เลือก") {
        if (!marker) {
            marker = L.marker([lat, lon], { draggable: true }).addTo(map);
            marker.on("dragend", (e) => {
                const pos = e.target.getLatLng();
                updateInputs(pos.lat, pos.lng);
                searchCoordinate();
            });
        } else {
            marker.setLatLng([lat, lon]);
        }

        marker.bindPopup(popupHtml).openPopup();
        map.setView([lat, lon], Math.max(map.getZoom(), 13));
    }

    function row(label, value, found = true) {
        const cls = found ? "found" : "notfound";
        return `
            <div class="row">
                <div class="label">${escapeHtml(label)}</div>
                <div class="value ${cls}">${escapeHtml(value || "ไม่พบ")}</div>
            </div>`;
    }

    function renderResult(data, reqLat, reqLon) {
        const safeLat = parseFloat(data.lat ?? reqLat);
        const safeLon = parseFloat(data.lon ?? reqLon);

        const displayLat = !isNaN(safeLat) ? safeLat.toFixed(6) : "ไม่พบ";
        const displayLon = !isNaN(safeLon) ? safeLon.toFixed(6) : "ไม่พบ";

        document.getElementById("result").innerHTML = `
            <div class="coord">
                <div><b>Latitude:</b> ${escapeHtml(displayLat)}</div>
                <div><b>Longitude:</b> ${escapeHtml(displayLon)}</div>
            </div>
            ${row("จังหวัด", data.province, data.found?.tambon)}
            ${row("อำเภอ", data.amphoe, data.found?.tambon)}
            ${row("ตำบล", data.tambon, data.found?.tambon)}
            ${row("ลุ่มน้ำหลัก", data.main_basin, data.found?.basin)}
            ${row("ลุ่มน้ำสาขา", data.sub_basin, data.found?.basin)}
            ${row("รหัส Area Based", data.code_AB, data.found?.area_based)}
            ${row("Area Based", data.name_AB, data.found?.area_based)}
            ${row("ประเภท Area Based", data.type_AB, data.found?.area_based)}
        `;
    }

    async function searchCoordinate() {
        const lat = parseFloat(document.getElementById("lat").value);
        const lon = parseFloat(document.getElementById("lon").value);
        const status = document.getElementById("status");
        const result = document.getElementById("result");
        const osmBox = document.getElementById("osm-box");
        const osmAddress = document.getElementById("osm-address");

        if (!Number.isFinite(lat) || !Number.isFinite(lon) ||
            lat < -90 || lat > 90 || lon < -180 || lon > 180) {
            status.textContent = "❌ พิกัดไม่ถูกต้อง";
            result.textContent = "กรุณาตรวจสอบ Latitude / Longitude";
            osmBox.style.display = "none";
            return;
        }

        setMarker(lat, lon, "⏳ กำลังค้นหาพื้นที่...");
        status.textContent = "⏳ กำลังค้นหาข้อมูล...";
        result.textContent = "กำลังประมวลผล Spatial Query...";
        osmBox.style.display = "block";
        osmAddress.textContent = "กำลังดึงข้อมูลสำรอง...";

        // 1. ดึงข้อมูลหลักจาก Python API
        try {
            const res = await fetch(API_URL, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ lat, lon })
            });

            const body = await res.json().catch(() => ({}));
            if (!res.ok || !body.success) {
                throw new Error(body.detail || `HTTP Error: ${res.status}`);
            }

            const data = body.data;
            renderResult(data, lat, lon);
            status.textContent = "✅ ประมวลผลข้อมูลสำเร็จ";

            const safeLat = parseFloat(data.lat ?? lat).toFixed(6);
            const safeLon = parseFloat(data.lon ?? lon).toFixed(6);

            const popup = `
                <b>📍 ตำแหน่งที่เลือก</b><br>
                Lat: ${escapeHtml(safeLat)}<br>
                Lon: ${escapeHtml(safeLon)}<br><br>
                <b>จังหวัด:</b> ${escapeHtml(data.province)}<br>
                <b>อำเภอ:</b> ${escapeHtml(data.amphoe)}<br>
                <b>ตำบล:</b> ${escapeHtml(data.tambon)}
            `;
            marker.bindPopup(popup).openPopup();
        } catch (err) {
            console.error(err);
            status.textContent = "❌ ค้นหาข้อมูล GIS หลักไม่สำเร็จ";
            result.textContent = err.message || "ไม่สามารถเชื่อมต่อ Python API ได้";
        }

        // 2. ดึงข้อมูลสำรองจาก OpenStreetMap Nominatim
        try {
            const osmRes = await fetch(`${NOMINATIM_URL}?lat=${lat}&lon=${lon}&format=json`);
            if (osmRes.ok) {
                const osmData = await osmRes.json();
                osmAddress.textContent = osmData.display_name || "ไม่พบที่อยู่จาก OpenStreetMap";
            } else {
                osmAddress.textContent = "ไม่สามารถดึงข้อมูลที่อยู่สำรองได้";
            }
        } catch (osmErr) {
            console.error("OSM Error:", osmErr);
            osmAddress.textContent = "เกิดข้อผิดพลาดในการดึงข้อมูลสำรอง";
        }
    }

    ["lat", "lon"].forEach(id => {
        document.getElementById(id).addEventListener("keydown", (e) => {
            if (e.key === "Enter") searchCoordinate();
        });
    });
</script>
</body>
</html>
